# /etc/nginx/sites-available/wem
#
# Nginx 反向代理：域名 → 127.0.0.1:3000（Next.js 生产服务）
#
# 后端 NestJS（4000）不需要在 Nginx 里单独开规则：
# 浏览器请求 /backend/* 会先到 Next，再由 next.config.ts 的 rewrites
# 反代到 127.0.0.1:4000，这样 HttpOnly 会话 Cookie 保持同源。
#
# 安全响应头（CSP / HSTS / X-Frame-Options 等）统一由应用层下发：
#   - 页面 → next.config.ts 的 headers()
#   - 接口 → NestJS 的 helmet
# 这样 /api 直连与 /backend 代理拿到的头完全一致，避免 Nginx 与上游
# 各写一份、内容漂移。Nginx 这里只负责它才能做的事：
#   server_tokens off   —— 不对外宣告 nginx 版本
#   拦截 /api/docs      —— 接口文档不对外
#   拦截点文件          —— .git / .env 之类一律 404
#   上传目录只读        —— 禁止非 GET 方法
#
# 启用：
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS 由 certbot 管理（证书路径与续期不要手改）。

# ---------------------------------------------------------------- HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;

    server_name stargalaxytech.xyz www.stargalaxytech.xyz;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/stargalaxytech.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stargalaxytech.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 工厂案例编辑器要传图，默认 1M 太小
    client_max_body_size 25m;

    # 压缩（Next 自带的静态资源已预压缩，这里主要压 HTML/JSON）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # 接口文档：应用层生产环境已经不挂载，这里再兜一层，
    # 避免哪天有人为了调试临时打开 ENABLE_API_DOCS 就把整套路由暴露到公网。
    # ^~ 的优先级高于普通前缀匹配，会先于下面的 /api/ 命中。
    location ^~ /api/docs {
        return 404;
    }

    # 点文件防护：.git / .env / .DS_Store 一律不返回内容。
    # .well-known 放行，ACME 续期偶尔会用到。
    location ~ /\.(?!well-known) {
        return 404;
    }

    # 构建产物文件名带 hash，可以长期缓存。
    # 这里不再手写 Cache-Control：Next 对 /_next/static/* 本身就会返回
    # public, max-age=31536000, immutable，手写反而会覆盖上游的头。
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 上传的图片由 NestJS 静态托管（apps/api/uploads，路径 /uploads/xxx），
    # 所以这里必须转给 4000，不是 3000。
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        # 只读目录：除了取图不应该接受任何写方法
        limit_except GET {
            deny all;
        }
    }

    # 接口直连：/api/* 直接代理到 NestJS。
    # 站内客户端代码走 /backend/*（Next 的 rewrites），
    # 这里再开一个 /api/* 是为了让「后端原生地址」也能直接访问、方便联调与对外文档。
    # 两者最终都到 127.0.0.1:4000，行为完全一致。
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
        # 接口响应不该被搜索引擎收录
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # /api 本身没有对应路由（NestJS 只有 /api/xxx），
    # 访问裸 /api 时直接回首页，而不是抛一个看不懂的 404。
    location = /api {
        return 302 /;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # 上游若残留版本标识，这里再摘一次
        proxy_hide_header X-Powered-By;
    }
}

# ---------------------------------------------------------------- HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name stargalaxytech.xyz www.stargalaxytech.xyz;

    # ACME HTTP-01 校验走这里，必须先于下面的全站跳转
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
