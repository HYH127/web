# /etc/nginx/sites-available/wem
#
# Nginx 反向代理：域名 → 127.0.0.1:3000（Next.js 生产服务）
#
# 后端 NestJS（4000）不需要在 Nginx 里单独开规则：
# 浏览器请求 /backend/* 会先到 Next，再由 next.config.ts 的 rewrites
# 反代到 127.0.0.1:4000，这样 HttpOnly 会话 Cookie 保持同源。
#
# 启用：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/wem
#   sudo ln -sf /etc/nginx/sites-available/wem /etc/nginx/sites-enabled/wem
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS（域名解析生效后执行，certbot 会自动改写本文件并加 443 段）：
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d stargalaxytech.xyz -d www.stargalaxytech.xyz --redirect

server {
    listen 80;
    listen [::]:80;

    # 没有域名时先填服务器公网 IP，验证通了再换域名
    server_name stargalaxytech.xyz www.stargalaxytech.xyz;

    # 工厂案例编辑器要传图，默认 1M 太小
    client_max_body_size 25m;

    # 压缩（Next 自带的静态资源已预压缩，这里主要压 HTML/JSON）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # 构建产物文件名带 hash，可以长期缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 上传的图片由 NestJS 静态托管（apps/api/uploads，路径 /uploads/xxx），
    # 所以这里必须转给 4000，不是 3000。
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
